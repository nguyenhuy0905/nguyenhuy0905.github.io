name: Deploy page

on:
  push:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install python and make
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make

      - name: Build the site
        run: >
          make

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build
          name: github-pages

  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    needs: build

    steps:
      - name: Deploy to GH Pages
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
